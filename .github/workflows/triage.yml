name: Issue Triage

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

jobs:
  triage:
    # Configure this environment's PI_AUTH_JSON before enabling the workflow.
    environment: pi-oauth
    concurrency:
      group: pi-oauth-auth-json
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check queued event
        id: current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="$(jq -er '.issue.number' "$GITHUB_EVENT_PATH")"
          expected="$(jq -c '["open", .issue.title, (.issue.body // "")]' "$GITHUB_EVENT_PATH")"
          actual="$(gh api "repos/$GITHUB_REPOSITORY/issues/$number" | jq -c '[.state, .title, (.body // "")]')"
          if [[ "$actual" == "$expected" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping a closed issue or superseded issue content."
          fi

      - name: Classify issue
        id: triage
        if: steps.current.outputs.current == 'true'
        uses: narumiruna/pi-actions/triage@10517c9297a5135606b2869f8d3781bfa7ea674d
        with:
          auth-json: ${{ secrets.PI_AUTH_JSON }}
          auth-output: ${{ runner.temp }}/pi-triage-auth/auth.json
          provider: openai
          model: gpt-6.1-sol
          thinking: medium

      - name: Persist refreshed credentials
        if: always() && steps.triage.outcome != 'skipped'
        uses: narumiruna/pi-actions/persist-auth@10517c9297a5135606b2869f8d3781bfa7ea674d
        with:
          auth-file: ${{ runner.temp }}/pi-triage-auth/auth.json
          auth-json: ${{ secrets.PI_AUTH_JSON }}
          token: ${{ secrets.PAT_TOKEN }}
