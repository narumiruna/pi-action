name: PR Review

on:
  pull_request_target:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pull-request:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Do not check out or execute pull request code in this trusted workflow.
    if: github.actor != 'dependabot[bot]'
    # Configure this environment's PI_AUTH_JSON before enabling the workflow.
    environment: pi-oauth
    concurrency:
      group: pi-oauth-auth-json
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check queued event
        id: current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          number="$(jq -er '.number' "$GITHUB_EVENT_PATH")"
          expected="$(jq -er '.pull_request.head.sha' "$GITHUB_EVENT_PATH")"
          actual="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" | jq -er '.head.sha')"
          if [[ "$actual" == "$expected" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping a superseded pull request head."
          fi

      - name: Review pull request
        id: review
        if: steps.current.outputs.current == 'true'
        uses: narumiruna/pi-actions/review@10517c9297a5135606b2869f8d3781bfa7ea674d
        with:
          pull-request: ${{ inputs.pull-request }}
          auth-json: ${{ secrets.PI_AUTH_JSON }}
          auth-output: ${{ runner.temp }}/pi-review-auth/auth.json
          provider: openai
          model: gpt-6.1-sol
          thinking: medium

      - name: Persist refreshed credentials
        if: always() && steps.review.outcome != 'skipped'
        uses: narumiruna/pi-actions/persist-auth@10517c9297a5135606b2869f8d3781bfa7ea674d
        with:
          auth-file: ${{ runner.temp }}/pi-review-auth/auth.json
          auth-json: ${{ secrets.PI_AUTH_JSON }}
          token: ${{ secrets.PAT_TOKEN }}
